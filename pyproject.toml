[project]
name = "ggner_3d"
version = "0.1.0"
description = "Analysis for 3D - NER data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bioframe>=0.8.0",
    "coolpuppy>=1.1.0",
    "cooltools>=0.7.1",
    "hicrep>=0.2.6",
    "joypy>=0.2.6",
    "ptitprince>=0.3.1",
    "pybbi>=0.4.2",
    "pysam>=0.23.3",
    "seaborn>=0.13.2",
    "statannotations==0.7.2",
    "statsmodels>=0.14.6",
    "upsetplot>=0.9.0",
    "venn>=0.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ggner_3d"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "tqdm>=4.67.1",
]
